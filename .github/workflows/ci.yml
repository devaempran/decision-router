name: ci

on:
  push:
  pull_request:

jobs:
  service:
    # The API tests fake the model, so they need neither a GPU nor llama-cpp-python.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask numpy waitress pytest ruff
      - run: ruff check .
      - run: pytest

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_PORT: "6379"   # the tests default to 6380 (the README's Docker command); the environment overrides it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install redis pytest ruff
      - run: ruff check .
      - run: pytest   # includes the slow end-to-end tests (about three minutes)

  compose-demo:
    # The five-minute path: no GPU, mock model, everything in containers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile demo up --build -d
      - name: wait for the demo tickets to be routed
        run: |
          for i in $(seq 1 60); do
            decided=$(curl -s localhost:5055/api/state | python3 -c "import json,sys; print(json.load(sys.stdin)['totals']['decided'])" 2>/dev/null || echo 0)
            echo "decided=$decided"
            [ "${decided:-0}" -ge 80 ] && exit 0
            sleep 5
          done
          docker compose logs --tail 50
          exit 1
      - name: dead-letter holds the edge cases
        run: |
          dead=$(curl -s localhost:5055/api/state | python3 -c "import json,sys; print(json.load(sys.stdin)['totals']['dead'])")
          test "$dead" -ge 1
      - run: docker compose --profile demo down
